<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axelle & Antonio — 26.09.2026</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fff;color:#171412;font-family:Georgia,serif}
    .loading{min-height:100vh;display:grid;place-items:center;font-style:italic;color:#7a746a}
  </style>
</head>
<body>
  <div class="loading">Chargement de l’invitation…</div>
  <script>
    (async function(){
      try {
        const urls = Array.from({length:8},(_,i)=>`parts/part-${String(i+1).padStart(2,'0')}.txt`);
        const parts = await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{
          if(!r.ok) throw new Error(u+' '+r.status);
          return r.text();
        })));
        let html = parts.join('');
        html = html.replace('</head>', '<link rel="stylesheet" href="door3d.css?v=2"></head>');
        html = html.replace('</body>', '<script src="supabase-rsvp.js?v=1"><\/script></body>');
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        document.body.innerHTML = '<div class="loading">Impossible de charger l’invitation. Merci de réessayer.</div>';
        console.error(e);
      }
    })();
  </script>
</body>
</html>
